name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The lash-line correction model tracks EyeContourRefiner's main branch and is
  # fetched by `pip install`, so re-test against the latest published model even
  # when this repository is idle.
  schedule:
    - cron: "0 18 * * *"  # daily, 03:00 JST
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # setup.py's build hook fetches the latest lash-line correction model
      # (EyeContourRefiner main) into src/face_makeup/models/; never cached.
      - name: Install dependencies
        run: pip install -e ".[dev,app]"

      - name: Show the installed lash-line correction model
        run: sha256sum src/face_makeup/models/eye_contour_refiner.onnx

      - name: Lint with ruff
        run: ruff check src tests setup.py

      - name: Download hair segmentation model
        run: |
          mkdir -p models
          curl -fsSL --retry 3 -o models/hair_segmenter.tflite \
            https://storage.googleapis.com/mediapipe-assets/hair_segmentation.tflite

      - name: Run tests
        run: pytest --cov
