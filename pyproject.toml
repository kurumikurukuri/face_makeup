[build-system]
# onnxruntime: setup.py validates the fetched lash-line model's ONNX contract.
requires = ["setuptools>=64", "wheel", "onnxruntime>=1.18"]
build-backend = "setuptools.build_meta"

[project]
name = "face_makeup"
version = "0.1.0"
description = "Face makeup simulation library using MediaPipe"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "kurumikurukuri"}
]
requires-python = ">=3.10,<3.13"
keywords = ["face", "makeup", "mediapipe", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "opencv-python-headless>=4.7.0,<5",  # 5.x changes warpAffine rounding and shifts lash-line correction model patches
    "numpy>=1.25.0,<2.0",
    "mediapipe==0.10.21",
    "pillow>=10.0.0",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "matplotlib>=3.7.0",
    "ruff>=0.6.0",
]
app = [
    "streamlit==1.58.0",
    # starlette 1.8 breaks Streamlit's media endpoint (st.image renders blank)
    "starlette<1.8",
    "pillow-heif>=0.13.0",
]

[project.urls]
Repository = "https://github.com/kurumikurukuri/face_makeup.git"

[tool.setuptools.packages.find]
where = ["src"]

# ruff configuration
# Pin the rule set explicitly so newer ruff releases (dev deps are unpinned)
# do not widen the default selection and break CI.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# coverage configuration
[tool.coverage.run]
source = ["src/face_makeup"]
omit = ["src/face_makeup/core/debug_visualizer.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
